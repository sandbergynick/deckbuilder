# ripjr.com: refresh the card data in Supabase once a day (prices change daily).
# Also runs whenever you press "Run workflow" on the Actions tab.
name: Card sync

on:
  schedule:
    - cron: '23 10 * * *'   # every day around 5am Central
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load Scryfall cards into Supabase
        run: node scripts/sync-cards.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
